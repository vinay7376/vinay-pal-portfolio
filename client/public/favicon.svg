<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="vpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon / shield -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
  
  <!-- Subtle inner geometric grid lines -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  <circle cx="64" cy="64" r="32" fill="none" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Monogram VP -->
  <g filter="url(#neonGlow)">
    <!-- V Stroke -->
    <path d="M 32 38 L 52 88 L 62 88 L 74 58" fill="none" stroke="url(#vpGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- P Stroke & Bow -->
    <path d="M 68 88 L 68 38 L 86 38 C 96 38, 102 44, 102 54 C 102 64, 96 70, 86 70 L 68 70" fill="none" stroke="url(#vpGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Decorative small cyber dot -->
  <circle cx="64" cy="98" r="3.5" fill="#38bdf8" />
</svg>
